version: '3.8'

services:
  easy-multi-profiler:
    build: 
      context: .
      dockerfile: Dockerfile
    image: xielab/easy-multi-profiler:latest
    container_name: easy-multi-profiler
    ports:
      - "5000:5000"
    volumes:
      # 数据持久化
      - ./data:/app/data
      - ./results:/app/results
      # 日志
      - ./logs:/app/logs
    environment:
      - FLASK_ENV=production
      - FLASK_PORT=5000
      - R_LIBS=/usr/local/lib/R/site-library
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # 可选：Nginx 反向代理（生产环境推荐）
  nginx:
    image: nginx:alpine
    container_name: easy-multi-profiler-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - easy-multi-profiler
    restart: unless-stopped
    profiles:
      - production

volumes:
  data:
  results:
  logs:
